schema_version: 1

context:
  name: pymzml
  version: "2.7.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pymzml-${{ version }}.tar.gz
  sha256: 9eb871349b2a168098898bd943b94712cb1eae5b40d450dde02e1239335205b5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.8.0
    - regex

tests:
  - python:
      imports:
        - pymzml
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: high-throughput mzML parsing
  license: MIT
  license_file: LICENSE.txt
  homepage: http://pymzml.github.com

extra:
  recipe-maintainers:
    - hadim
